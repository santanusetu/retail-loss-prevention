plugins {
    id 'com.android.application'
}

// Optional local settings, never committed: local.properties
//   api.baseUrl=https://your-server.example.com/   (omit to run in demo mode)
//   maps.apiKey=YOUR_GOOGLE_STATIC_MAPS_KEY          (omit to skip the map preview)
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def apiBaseUrl = localProps.getProperty('api.baseUrl', '')
def mapsApiKey = localProps.getProperty('maps.apiKey', '')

android {
    namespace 'com.sjsu.cmpe273.lparilogisticapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sjsu.cmpe273.lparilogisticapp'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'

        // With no backend configured the app serves bundled sample data
        buildConfigField 'String', 'API_BASE_URL', "\"${apiBaseUrl ?: 'https://demo.lpari.local/'}\""
        buildConfigField 'boolean', 'DEMO_MODE', "${apiBaseUrl.isEmpty()}"
        buildConfigField 'String', 'MAPS_API_KEY', "\"${mapsApiKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'me.dm7.barcodescanner:zxing:1.9.8'
    implementation 'com.github.gcacace:signature-pad:1.3.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v2.2.4'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    testImplementation 'junit:junit:4.13.2'
}
